[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -m "not smoke and not perf"
markers =
    asyncio: marks tests as async
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: starts each entry point as a real process; run with -m smoke
    perf: wall-clock timing checks that flake under CPU contention; run with -m perf
asyncio_mode = auto