# No `rev:`: uv.lock pins these tools, so bump one with `uv lock --upgrade-package <tool>`.
# `python -m` is deliberate—plain `uv run --no-sync ruff` falls back to any ruff on
# PATH when the venv has none. `--no-sync` keeps the hook out of the environment: without
# it, a commit that edits pyproject.toml gets its own dependency change installed by the
# hook checking it.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync python -m ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]

      # Blocks the commit, unlike the advisory CI step (continue-on-error).
      - id: mypy
        name: mypy
        entry: uv run --no-sync python -m mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
