schema_version: '1.1'
name: compromise-log-check-reports-short-retention-as-unknown
runs: 3
tags:
- compromise
- log-retention
execution:
  max_turns: 20
  prompt: |-
    In the Alpacon workspace `acme`, was Metabase on web-01 (`7c9e6679-7425-40de-944b-e07fc1f90ae7`, Ubuntu 24.04) hit through CVE-2026-72898 before we patched it? Metabase's advisory (https://www.metabase.com/blog/security-update, which I re-read today) gives the pattern: `POST /api/session/reset_password` answered 400, followed by `GET /api/user/current` answered 200. Search `/var/log/nginx/access.log`, the only proxy in front of it, which serves only Metabase and writes only requests, from 2026-08-03 to 2026-11-23. Work Session `5d1c2a7e-0b8f-4c3e-9a41-2f6d8e3b9c10` is already active for web-01 with the `command` and `webftp` scopes and the `ubuntu` account, which can read that log. I've read the compromise-log-check skill's search and pairing run with the Metabase patterns and agree to them running on web-01 as `ubuntu` in that session, with the script written to `/home/ubuntu/alpacon-log-search-CVE-2026-72898.sh`, overwritten by each rerun and left there.
graders:
- name: writes-to-the-agreed-path
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_file
  input_match: '"path": ?"/home/ubuntu/alpacon-log-search-CVE-2026-72898\.sh"'
  min: 1
  weight: 2
- name: no-command-line-fallback
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  min: 0
  max: 0
  weight: 3
- name: no-cli
  type: tool_used
  tool: Bash
  input_match: (?:^|\\n|[\s;&|(/"'`])(?:alpacon|ssh|scp|sftp|curl)(?:[\s"`;|&)]|\\n|$)|alpacon\.io/api
  min: 0
  max: 0
  weight: 3
- name: searches-once
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_file
  input_match: logs='/var/log/nginx/access\.log'[\s\S]*patterns='\^\\*"\[Pp\]\[Oo\]\[Ss\]\[Tt\] [^']*reset_password[^']*\\*" 400\( \|\$\)'[\s\S]*control='\\*"\(\[\^\\*"\\*\]\|\\*\.\)\*\\*" \[0-9\]\[0-9\]\[0-9\]\( \|\$\)'[\s\S]*also=''[\s\S]*END-OF-LOG[\s\S]*problems=
  min: 1
  max: 1
  weight: 3
- name: no-pairing-run-without-an-anchor
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_file
  input_match: patterns='[^']*user/current
  min: 0
  max: 0
  weight: 2
- name: reports-unknown
  type: llm
  weight: 3
  criteria: The final answer reports web-01 as unknown, because the oldest log line is from 10 November 2026 and the search had to reach back to 3 August 2026, even though no request matched. It quotes or names that oldest log time. It says the logs should be copied by a person before rotation deletes more of them. It fails if it calls web-01 not matched, clean, safe or not compromised, if it says web-01 was compromised, or if it claims to have copied logs, invalidated sessions or rotated credentials.
