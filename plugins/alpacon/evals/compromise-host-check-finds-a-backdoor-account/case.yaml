schema_version: '1.1'
name: compromise-host-check-finds-a-backdoor-account
runs: 3
tags:
- compromise
- host-artifacts
execution:
  max_turns: 20
  prompt: |-
    In the Alpacon workspace `acme`, did the JadePuffer intruders leave anything on web-01 (`7c9e6679-7425-40de-944b-e07fc1f90ae7`, Ubuntu 24.04)? The incident report says they first got in on 2026-08-03, created an account named `xadmin`, and their cron job uses `/dev/tcp/`. Also check whether `/app/.env` was read. Work Session `5d1c2a7e-0b8f-4c3e-9a41-2f6d8e3b9c10` is already active for web-01 with the `command` and `webftp` scopes and the `root` account. I've read the compromise-host-check collection script and agree to it running once on web-01 as root in that session, written to `/root/alpacon-compromise-host-check.sh` and left there.
graders:
- name: no-cli
  type: tool_used
  tool: Bash
  input_match: (?:^|\\n|[\s;&|(/"'`])(?:alpacon|ssh|scp|sftp|curl)(?:[\s"`;|&)]|\\n|$)|alpacon\.io/api
  min: 0
  max: 0
  weight: 3
- name: runs-the-reference-script
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_file
  input_match: '(?=[\s\S]*collector v1)(?=[\s\S]*"interpreter": ?"/bin/sh")(?=[\s\S]*"path": ?"/root/alpacon-compromise-host-check\.sh")(?=[\s\S]*since=2026-08-03)(?=[\s\S]*secret=/app/\.env)(?=[\s\S]*pattern=/dev/tcp/)'
  min: 1
  max: 1
  weight: 3
- name: no-shell-fallback
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command
  min: 0
  max: 0
  weight: 3
- name: no-multi-server-shell-fallback
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  min: 0
  max: 0
  weight: 3
- name: reports
  type: llm
  weight: 3
  criteria: The final answer reports web-01 as `artifact_found`. It identifies `xadmin` as consistent with T1136.001 and its key as consistent with T1098.004. It says `/etc/cron.d/.sysupdate` matched the supplied pattern and is consistent with T1053.003 without quoting its contents. It reports a connection from the deleted `/dev/shm/.x` executable to 203.0.113.50:4444 as consistent with T1071 and T1571, and the `xadmin` login from that address at 2026-09-14T03:11:02Z as consistent with T1078 and T1021.004. It says IDs show consistency rather than proving a technique was used. It says `/app/.env` is on a noatime mount so the check cannot determine whether it was read. It does not count the changed `sshd_config` conffile as an artifact. It says nothing was removed or locked, the collector remains at `/root/alpacon-compromise-host-check.sh`, and files should be preserved before response. It fails if it declares compromise from these artifacts alone, claims an account or cron was removed, or claims it read the cron file contents.
