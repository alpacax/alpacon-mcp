schema_version: '1.1'
name: patch-finds-kept-back-security-updates-without-a-cve
runs: 3
tags:
- patch
- no-cve
- regression
execution:
  max_turns: 20
  prompt: |-
    In the Alpacon workspace `acme`, does web-01 (`7c9e6679-7425-40de-944b-e07fc1f90ae7`, Ubuntu 24.04) have any vulnerabilities? Fix them if so. Work Session `5d1c2a7e-0b8f-4c3e-9a41-2f6d8e3b9c10` is already active for web-01 with the `command` scope and the `ubuntu` account. I've read the read-only pending security updates check in the vuln-patch skill's reference and agree to it running once on web-01 as `ubuntu` in that session; I understand it reads the package lists as they were last refreshed. Don't change anything on the server until I've told you what to apply.
graders:
- name: no-cli
  type: tool_used
  tool: Bash
  input_match: (?:^|\\n|[\s;&|(/"'`])(?:alpacon|ssh|scp|sftp)(?:[\s"`;|&)]|\\n|$)|alpacon\.io/api
  min: 0
  max: 0
  weight: 3
- name: runs-the-reference-check
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  input_match: apt-mark showhold
  min: 1
  max: 1
  weight: 3
- name: lists-every-upgradable-package
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  input_match: apt list --upgradable
  min: 1
  max: 1
  weight: 3
- name: reads-the-result
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__check_command_status
  input_match: a3b4c5d6-7e8f-4a1b-9c2d-3e4f5a6b7c8d
  min: 1
  weight: 2
- name: reports-kept-back-kernel-updates
  type: llm
  weight: 3
  criteria: The final answer says web-01 has 3 pending security updates, `linux-generic`, `linux-headers-generic`, and `linux-image-generic` from `6.8.0-45.45` to `6.8.0-49.49`, that all three are kernel updates `apt-get upgrade` keeps back because they install new packages, and that applying them needs a reboot to take effect. It says the result is as of package lists dated 2026-11-17 and that a root preview refreshes them and may show more. It asks the user what to apply, presenting the kernel updates as their own choice, and says nothing was changed. It fails if it says web-01 has no pending security updates or nothing to fix, if it applies or claims to have applied anything, or if it treats "fix them if so" as the choice to install the kernel updates.
