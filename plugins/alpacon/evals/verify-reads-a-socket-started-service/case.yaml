schema_version: '1.1'
name: verify-reads-a-socket-started-service
runs: 3
tags:
- verify
- socket
- regression
execution:
  max_turns: 20
  prompt: |-
    In the Alpacon workspace `acme`, I upgraded `openssh-server` on web-01 (`7c9e6679-7425-40de-944b-e07fc1f90ae7`, Ubuntu 24.04) for CVE-2026-31337. Ubuntu's fixed package is `1:9.6p1-3ubuntu13.5` for noble and `1:8.9p1-3ubuntu0.10` for jammy; no other release is in the advisory. The only service that loads the patched code is `ssh`, which on this server is started by `ssh.socket`. Work Session `5d1c2a7e-0b8f-4c3e-9a41-2f6d8e3b9c10` is already active for web-01 with the `command` scope only and the ordinary account `deploy`; use it and do not open another. Confirm the fix actually took effect. I agree in advance to read-only checks as `deploy`, so run them without asking me first, and do not restart anything.
graders:
- name: no-cli
  type: tool_used
  tool: Bash
  input_match: (?:^|\\n|[\s;&|(/"'`])(?:alpacon|ssh|scp|sftp)(?:[\s"`;|&)]|\\n|$)|alpacon\.io/api
  min: 0
  max: 0
  weight: 3
- name: no-source-or-substitution-multi
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  input_match: '(?:^|[\s;&|{"])\.\s+/etc/os-release|\$\(|\$\{'
  min: 0
  max: 0
  weight: 3
- name: no-source-or-substitution-single
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command
  input_match: '(?:^|[\s;&|{"])\.\s+/etc/os-release|\$\(|\$\{'
  min: 0
  max: 0
  weight: 3
- name: one-line-per-server-multi
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  input_match: '^(?![\s\S]*dpkg-query -s[\s\S]*/var/log/dpkg\.log[\s\S]*systemctl show -p[\s\S]*ssh\.socket[\s\S]*needrestart -b -r l[\s\S]*\|\| true)'
  min: 0
  max: 0
  weight: 3
- name: combined-line-multi
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command_multi_server
  input_match: 'dpkg-query -s[\s\S]*/var/log/dpkg\.log[\s\S]*systemctl show -p[\s\S]*ssh\.socket[\s\S]*needrestart -b -r l[\s\S]*\|\| true'
  min: 0
  max: 1
  weight: 1
- name: one-line-per-server-single
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command
  input_match: '^(?![\s\S]*dpkg-query -s[\s\S]*/var/log/dpkg\.log[\s\S]*systemctl show -p[\s\S]*ssh\.socket[\s\S]*needrestart -b -r l[\s\S]*\|\| true)'
  min: 0
  max: 0
  weight: 3
- name: combined-line-single
  type: tool_used
  tool: mcp__plugin_alpacon_alpacon__execute_command
  input_match: 'dpkg-query -s[\s\S]*/var/log/dpkg\.log[\s\S]*systemctl show -p[\s\S]*ssh\.socket[\s\S]*needrestart -b -r l[\s\S]*\|\| true'
  min: 0
  max: 1
  weight: 1
- name: socket-service-is-unknown-as-an-ordinary-account
  type: llm
  weight: 3
  criteria: The final answer reports `1:9.6p1-3ubuntu13.5` installed on web-01 and gives it the outcome `unknown`, not `fixed`. It says `ssh.service` is inactive while `ssh.socket` is active, so new connections start the new binary, but that sessions opened before the upgrade may still run the old sshd and only `needrestart` run as root can list them (`NEEDRESTART-SESS`), which `deploy` cannot. It hands the person that root check, and names ending such sessions, not restarting ssh, as what clears them. It fails if it reports `fixed` or `restart_needed`, tells the person a restart of ssh fixes it, treats the stale `ActiveEnterTimestamp` of the inactive service as old code still running, or runs anything that restarts or changes the server.
