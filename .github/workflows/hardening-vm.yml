name: Hardening check VM

on:
  pull_request:
    paths:
      - 'plugins/alpacon/skills/hardening-check/**'
      - 'tests/lima/**'
      - 'tests/hardening.py'
      - '.github/workflows/hardening-vm.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/alpacon/skills/hardening-check/**'
      - 'tests/lima/**'
      - 'tests/hardening.py'
      - '.github/workflows/hardening-vm.yml'

permissions:
  contents: read

jobs:
  hardening-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        template: [ubuntu-24.04, rocky-9]
        include:
          - template: ubuntu-24.04
            family: debian
          - template: rocky-9
            family: rhel
    env:
      UV_PYTHON: python3.14

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          version: v2.3.0

      - name: Start Lima VM
        env:
          TEMPLATE: ${{ matrix.template }}
        run: limactl start --tty=false --plain --name=hardening --cpus=2 --memory=2 "template://$TEMPLATE"

      - name: Run hardening checks
        env:
          FAMILY: ${{ matrix.family }}
          HARDENING_VM_DEBIAN: ${{ matrix.family == 'debian' && 'hardening' || '' }}
          HARDENING_VM_RHEL: ${{ matrix.family == 'rhel' && 'hardening' || '' }}
        run: uv run --no-sync pytest -m lima tests/lima -k "$FAMILY"
