# Test workflow - runs on every push and PR
name: Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: python${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # hatch-vcs derives the version from git tags

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Install dependencies
      run: uv sync --extra dev --locked

    # Includes the dev extra: constraint-dependencies already floors dev-only packages for advisories.
    # uvx, not the dev extra: pip-audit and its dependencies stay out of uv.lock.
    - name: Audit locked dependencies with pip-audit
      id: audit
      if: matrix.python-version == '3.14'  # the image's Python; the export has no python_version markers today
      continue-on-error: true  # non-blocking: a new advisory, possibly with no fixed release, would fail unrelated PRs
      run: |
        uv export --quiet --locked --extra dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
        uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

    - name: Warn when pip-audit fails
      if: steps.audit.outcome == 'failure'  # the job stays green, so surface the failure on the PR summary
      run: echo "::warning title=pip-audit::pip-audit reported a failure on uv.lock; see the audit step log"

    - name: Lint with ruff
      run: uv run --no-sync python -m ruff check .

    - name: Check formatting with ruff
      run: uv run --no-sync python -m ruff format --check .

    - name: Type check with mypy
      run: uv run --no-sync python -m mypy .

    - name: Test with pytest
      run: |
        uv run --no-sync pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=60
      env:
        PYTHONPATH: .

    - name: Entry point smoke tests
      run: uv run --no-sync pytest -m smoke tests/test_entry_point_smoke.py -v --tb=short
      env:
        PYTHONPATH: .

  docker-build:
    # docker.yml builds only after a merge to main, so a broken Dockerfile would land first
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image without pushing
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        platforms: linux/amd64
        tags: alpacon-mcp:ci
        cache-from: type=gha

    - name: Check the image runs as uid 200
      run: test "$(docker run --rm --entrypoint id alpacon-mcp:ci -u)" = 200
