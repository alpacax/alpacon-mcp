# Test workflow - runs on every push and PR
name: Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: python${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # hatch-vcs derives the version from git tags

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Install dependencies
      run: uv sync --extra dev --locked

    - name: Lint with ruff
      run: uv run --no-sync python -m ruff check .

    - name: Check formatting with ruff
      run: uv run --no-sync python -m ruff format --check .

    - name: Type check with mypy
      run: uv run --no-sync python -m mypy --ignore-missing-imports --no-strict-optional .
      continue-on-error: true

    - name: Test with pytest
      run: |
        uv run --no-sync pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=60
      env:
        PYTHONPATH: .
